name: Sync Zenodo publications

on:
  schedule:
    - cron: '23 5 * * *' # Daily at 05:23 UTC.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zenodo-publication-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Sync, validate and commit changed metadata
        run: |
          # This reset is confined to the disposable Actions checkout.
          # Rebuild from latest main if an approval or another push wins the race.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/sync_zenodo.py --write
            python update_README.py
            python -m unittest discover -s tests -v
            python scripts/build_site.py
            git add -- data/zenodo-publications.csv README.md
            if git diff --cached --quiet; then
              echo 'Zenodo publication metadata is unchanged.'
              exit 0
            fi
            git commit -m 'chore: sync Zenodo community publications'
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo 'Could not push sync. Check branch protection and rerun the workflow.' >&2
          exit 1
      - name: Request Pages deployment
        # GITHUB_TOKEN commits do not trigger push workflows. Explicit dispatch
        # also repairs a previous dispatch failure when the data is unchanged.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
